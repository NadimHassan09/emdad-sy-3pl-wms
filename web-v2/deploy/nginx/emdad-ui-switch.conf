# Staging only. Default stays on the classic UI (v1) until Gate G1 passes.
map $cookie_emdad_ui $emdad_staging_admin_root {
    default  /var/www/emdad-sy-3pl-wms-staging/frontend/dist;
    v2       /var/www/emdad-sy-3pl-wms-staging/web-v2/apps/admin/dist;
}
map $cookie_emdad_ui $emdad_staging_client_root {
    default  /var/www/emdad-sy-3pl-wms-staging/client-frontend/dist;
    v2       /var/www/emdad-sy-3pl-wms-staging/web-v2/apps/client/dist;
}

# Legacy staging client on server IP:8443 (classic client-frontend/).
# Use https://<server-ip>:8443/ — domains serve web-v2 client instead.

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name 187.124.19.162 _;

    ssl_certificate     /etc/nginx/ssl/emdad-wms-staging/staging.crt;
    ssl_certificate_key /etc/nginx/ssl/emdad-wms-staging/staging.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include snippets/emdad-wms-staging-backend-locations.conf;

    root /var/www/emdad-sy-3pl-wms-staging/client-frontend/dist;
    index index.html;

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    access_log /var/log/nginx/emdad-staging-ip-client.access.log;
    error_log  /var/log/nginx/emdad-staging-ip-client.error.log;
}

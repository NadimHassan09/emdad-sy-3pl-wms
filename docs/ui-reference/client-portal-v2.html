      const s = statusMeta[status] || statusMeta.draft;

        <span className={cx('inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold border', s.bg, s.text, s.border)}>

      return (

    function IconButton({ icon, badge, onClick, active }) {
      return (

      const [openSections, setOpenSections] = useState({ warehouse: true, store: true });

              <div><h1 className="text-xl font-bold text-slate-900">Billing</h1><p className="text-xs text-slate-500">Invoices, payments, and subscription</p></div>

                <div><div className="text-xs text-slate-500">Cycle length</div><div className="text-sm font-semibold text-slate-900">30 days</div></div>
              </div>
            </Card>

            <Card className="p-6" hover>
              <div className="text-xs font-medium text-slate-500 uppercase tracking-wide mb-4">Payment Summary</div>
              <div className="space-y-3">
                <div className="flex justify-between text-sm"><span className="text-slate-500">Total invoices</span><span className="font-semibold text-slate-900">2</span></div>
                <div className="flex justify-between text-sm"><span className="text-slate-500">Paid</span><span className="font-semibold text-emerald-600">0</span></div>
                <div className="flex justify-between text-sm"><span className="text-slate-500">Outstanding</span><span className="font-semibold text-rose-600">20 SYP</span></div>
              </div>
              <button className="w-full mt-5 py-2 bg-slate-900 text-white rounded-lg text-sm font-medium hover:bg-slate-800 transition-colors">Download statement</button>
            </Card>
          </div>

          <Card className="p-6">
            <h3 className="font-semibold text-slate-900 mb-1">Billing Trend</h3>
            <p className="text-xs text-slate-500 mb-6">Invoice amounts over the last 6 months</p>
            <div className="h-56">
              <ResponsiveContainer width="100%" height="100%">
                <AreaChart data={BILLING_TREND}>
                  <defs><linearGradient id="billGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#10B981" stopOpacity={0.2}/><stop offset="95%" stopColor="#10B981" stopOpacity={0}/></linearGradient></defs>
                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#F1F5F9" />
                  <XAxis dataKey="month" axisLine={false} tickLine={false} tick={{fill:'#64748B',fontSize:12}} dy={10} />
                  <YAxis axisLine={false} tickLine={false} tick={{fill:'#64748B',fontSize:12}} />
                  <Tooltip contentStyle={{borderRadius:10,border:'1px solid #E2E8F0',boxShadow:'0 10px 15px -3px rgb(0 0 0 / 0.05)'}} />
                  <Area type="monotone" dataKey="amount" stroke="#10B981" strokeWidth={2} fill="url(#billGrad)" />
                </AreaChart>
              </ResponsiveContainer>
            </div>
          </Card>

          <Card className="overflow-hidden">
            <div className="p-5 border-b border-slate-100 flex items-center justify-between">
              <div><h3 className="font-semibold text-slate-900">Invoice History</h3><p className="text-xs text-slate-500 mt-0.5">All invoices and payment status</p></div>
              <button className="text-xs font-semibold text-emerald-600 hover:text-emerald-700">Export CSV</button>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-slate-50/80 text-xs uppercase text-slate-500 font-semibold">
                  <tr><th className="px-5 py-3 text-left">Invoice #</th><th className="px-5 py-3 text-left">Cycle</th><th className="px-5 py-3 text-right">Amount</th><th className="px-5 py-3 text-left">Status</th><th className="px-5 py-3 text-left">Issued</th><th className="px-5 py-3 text-left">Created</th></tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {INVOICES.map(inv => (
                    <tr key={inv.id} className="hover:bg-slate-50/60 transition-colors">
                      <td className="px-5 py-3.5 font-semibold text-slate-900">{inv.id}</td>
                      <td className="px-5 py-3.5 text-slate-600 text-xs">{inv.cycle}</td>
                      <td className="px-5 py-3.5 text-right font-semibold text-slate-900">{inv.amount} SYP</td>
                      <td className="px-5 py-3.5"><Badge status={inv.status.toLowerCase()} /></td>
                      <td className="px-5 py-3.5 text-slate-500 text-xs">{inv.issued || '—'}</td>
                      <td className="px-5 py-3.5 text-slate-500 text-xs">{inv.created}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        </div>
      );
    }

    /* ─── NOTIFICATIONS ─── */
    function NotificationsPage() {
      const [tab, setTab] = useState('all');
      const [items, setItems] = useState(NOTIFICATIONS);
      const filtered = items.filter(n => tab==='all' ? true : tab==='unread' ? !n.read : n.read);
      const markAll = () => setItems(prev => prev.map(n => ({ ...n, read: true })));
      const toggleRead = (id) => setItems(prev => prev.map(n => n.id===id ? { ...n, read: !n.read } : n));
      const unreadCount = items.filter(n => !n.read).length;
      const typeIcon = (t) => t==='order' ? 'fa-box' : 'fa-file-invoice';
      const typeColor = (t) => t==='order' ? 'bg-blue-50 text-blue-600' : 'bg-amber-50 text-amber-600';
      return (
        <div className="space-y-5 animate-enter max-w-4xl">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center"><i className="fa-solid fa-bell text-emerald-600" /></div>
              <div>
                <h1 className="text-xl font-bold text-slate-900">Notifications</h1>
                <p className="text-xs text-slate-500">You have <span className="font-semibold text-emerald-600">{unreadCount}</span> unread notifications</p>
              </div>
            </div>
            <button onClick={markAll} className="px-3 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors flex items-center gap-2">
              <i className="fa-solid fa-check-double text-xs" /> Mark all read
            </button>
          </div>

          <div className="flex gap-1 p-1 bg-slate-100/60 rounded-xl w-fit">
            {[{id:'all',label:'All'},{id:'unread',label:'Unread'},{id:'read',label:'Read'}].map(t => (
              <button key={t.id} onClick={()=>setTab(t.id)} className={cx('px-4 py-2 rounded-lg text-sm font-medium transition-all', tab===t.id ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700')}>
                {t.label} {t.id==='unread' && unreadCount>0 ? <span className="ml-1 bg-emerald-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">{unreadCount}</span> : null}
              </button>
            ))}
          </div>

          <div className="space-y-2">
            {filtered.map(n => (
              <div key={n.id} onClick={() => toggleRead(n.id)} className={cx('group flex items-start gap-4 p-4 rounded-xl border transition-all cursor-pointer', n.read ? 'bg-white border-slate-200/60 hover:border-slate-300' : 'bg-emerald-50/30 border-emerald-200/40 hover:bg-emerald-50/50')}>
                <div className={cx('w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5', typeColor(n.type))}>
                  <i className={cx('fa-solid', typeIcon(n.type))} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2">
                    <h3 className={cx('text-sm font-semibold', n.read ? 'text-slate-700' : 'text-slate-900')}>{n.title}</h3>
                    {!n.read && <span className="w-2 h-2 rounded-full bg-emerald-500" />}
                  </div>
                  <p className="text-sm text-slate-500 mt-0.5 leading-relaxed">{n.body}</p>
                  <p className="text-xs text-slate-400 mt-2 font-medium">{n.date}</p>
                </div>
                <button className="opacity-0 group-hover:opacity-100 transition-opacity w-8 h-8 rounded-lg hover:bg-white flex items-center justify-center text-slate-400 hover:text-slate-600">
                  <i className={cx('fa-solid', n.read ? 'fa-envelope-open' : 'fa-envelope')} />
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ─── PROFILE ─── */
    function ProfilePage() {

        <div className="space-y-5 animate-enter max-w-3xl">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center"><i className="fa-solid fa-user text-emerald-600" /></div>
            <div><h1 className="text-xl font-bold text-slate-900">Profile</h1><p className="text-xs text-slate-500">Your account and preferences</p></div>
          </div>

          <Card className="overflow-hidden">
            <div className="h-24 bg-slate-900 relative">
              <div className="absolute inset-0 opacity-20" style={{backgroundImage:'radial-gradient(circle at 2px 2px, rgba(255,255,255,0.15) 1px, transparent 0)', backgroundSize:'20px 20px'}} />
            </div>
            <div className="px-6 pb-6">
              <div className="relative -mt-10 mb-4 flex items-end justify-between">
                <div className="w-20 h-20 rounded-2xl bg-emerald-600 border-4 border-white shadow-lg flex items-center justify-center text-white text-2xl font-bold">{USER.avatar}</div>
                <button className="mb-1 px-3 py-1.5 text-xs font-medium text-slate-600 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">Edit profile</button>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="p-3 bg-slate-50 rounded-lg border border-slate-100"><div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Name</div><div className="text-sm font-semibold text-slate-900 mt-0.5">{USER.name}</div></div>
                <div className="p-3 bg-slate-50 rounded-lg border border-slate-100"><div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Email</div><div className="text-sm font-semibold text-slate-900 mt-0.5">{USER.email}</div></div>
                <div className="p-3 bg-slate-50 rounded-lg border border-slate-100"><div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Role</div><div className="text-sm font-semibold text-slate-900 mt-0.5">{USER.role}</div></div>
                <div className="p-3 bg-slate-50 rounded-lg border border-slate-100"><div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Company</div><div className="text-sm font-semibold text-slate-900 mt-0.5">{USER.company}</div></div>
              </div>
            </div>
          </Card>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <Card className="p-5 hover-lift cursor-pointer" hover>
              <div className="flex items-start justify-between">
                <div className="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center"><i className="fa-solid fa-bell text-blue-600" /></div>
                <i className="fa-solid fa-arrow-right text-slate-300 text-xs" />
              </div>
              <h3 className="text-sm font-semibold text-slate-900 mt-3">Notifications</h3>
              <p className="text-xs text-slate-500 mt-1">View and manage your notification preferences.</p>
            </Card>
            <Card className="p-5 hover-lift cursor-pointer" hover>
              <div className="flex items-start justify-between">
                <div className="w-10 h-10 rounded-lg bg-emerald-50 flex items-center justify-center"><i className="fa-solid fa-file-invoice-dollar text-emerald-600" /></div>
                <i className="fa-solid fa-arrow-right text-slate-300 text-xs" />
              </div>
              <h3 className="text-sm font-semibold text-slate-900 mt-3">Billing</h3>
              <p className="text-xs text-slate-500 mt-1">Review invoices, payments, and subscription.</p>
            </Card>
          </div>

          <Card className="p-5">
            <h3 className="text-sm font-semibold text-slate-900">Need help?</h3>
            <p className="text-xs text-slate-500 mt-1 leading-relaxed">Contact your warehouse account manager for access changes or billing questions.</p>
            <button className="mt-3 px-3 py-1.5 text-xs font-medium text-emerald-700 bg-emerald-50 rounded-lg hover:bg-emerald-100 transition-colors">Contact support</button>
          </Card>
        </div>
      );
    }

    /* ─── APP SHELL ─── */
    function App() {
      const [page, setPage] = useState('dashboard');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [notifOpen, setNotifOpen] = useState(false);
      const [searchOpen, setSearchOpen] = useState(false);

      const navigate = (p) => { setPage(p); setNotifOpen(false); window.scrollTo(0,0); };

      const renderPage = () => {
        switch(page) {
          case 'dashboard': return <Dashboard onNavigate={navigate} />;
          case 'inbound': return <OrdersPage type="inbound" onBack={()=>navigate('dashboard')} />;
          case 'outbound': return <OrdersPage type="outbound" onBack={()=>navigate('dashboard')} />;
          case 'online-orders':
          case 'cod':
          case 'returns': return <StorePage subtab={page} onNavigate={navigate} />;
          case 'products': return <ProductsPage />;
          case 'billing': return <BillingPage />;
          case 'notifications': return <NotificationsPage />;
          case 'profile': return <ProfilePage />;
          default: return <Dashboard onNavigate={navigate} />;
        }
      };

      return (
        <div className="flex h-screen bg-slate-50">
          <Sidebar page={page} onNavigate={navigate} collapsed={sidebarCollapsed} onToggle={()=>setSidebarCollapsed(!sidebarCollapsed)} />
          <div className="flex-1 flex flex-col min-w-0">
            <TopBar onNavigate={navigate} notifOpen={notifOpen} setNotifOpen={setNotifOpen} searchOpen={searchOpen} setSearchOpen={setSearchOpen} />
            <main className="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
              <div className="max-w-7xl mx-auto">
                {renderPage()}
              </div>
            </main>
          </div>
          {notifOpen && <div className="fixed inset-0 z-40" onClick={()=>setNotifOpen(false)} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
